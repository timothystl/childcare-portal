project_id = "dahdstopsumxnqvdclmy"

# `family-lookup` is intentionally callable without an Authorization JWT.
# It performs its own credential check (email + PIN via family_login RPC),
# and forcing JWT verification at the gateway breaks the parent portal
# whenever the SDK happens to attach a session token the gateway can't
# verify (e.g. ES256 admin sessions when the project mixes signing keys).
[functions.family-lookup]
verify_jwt = false

# `request-pin-reset` is also called from unauthenticated parent pages
# (the "Forgot PIN?" flow on /calendar). It does its own input handling
# and always responds 200 to avoid leaking whether an email exists, so
# JWT verification adds nothing.
[functions.request-pin-reset]
verify_jwt = false

# `finance-summary` is called server-to-server by the church's ChMS finance
# integration, authenticated by a static X-Api-Key shared secret
# (FINANCE_API_KEY) rather than a Supabase session — there's no user JWT for
# a server-to-server caller to hold.
[functions.finance-summary]
verify_jwt = false

# Parent payment endpoints require a valid Supabase access token at the
# gateway and repeat ownership/authentication checks inside the function.
[functions.create-stax-charge]
verify_jwt = true

[functions.charge-stax-payment]
verify_jwt = true

# Stax cannot present a Supabase JWT. The webhook verifies a URL secret and,
# critically, re-fetches the transaction from Stax with the server API key
# before any database mutation.
[functions.stax-webhook]
verify_jwt = false

# This temporary function must be deleted. If deletion is not immediately
# possible, deploying the checked-in implementation leaves only a 410 stub.
[functions.stax-webhook-admin-tmp]
verify_jwt = true
