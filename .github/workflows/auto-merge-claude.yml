name: Auto-merge Claude branches into main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Quality gate (R7/R8). This workflow previously merged straight to main and
  # deployed with no test, no build check and no review — on a live system
  # holding children's records. `merge-to-main` now depends on this job, so a
  # red gate means nothing merges and nothing deploys.
  #
  # The dist check matters especially here: the deploy has NO build step
  # (Cloudflare Workers serves the committed files), so a dist/ bundle that
  # doesn't match js/ means the live site silently runs stale code.
  # ──────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify dist/ is rebuilt and committed
        run: |
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is out of sync with js/. Run 'npm run build' and commit the result."
            echo "The deploy has no build step, so the live site would keep serving the old bundle."
            exit 1
          fi

  merge-to-main:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Moved ahead of the merge step (was previously only before deploy):
      # resolving a dist/*.min.js conflict now rebuilds from source rather
      # than picking a side, and that rebuild needs npm available mid-merge.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Merge Claude branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git merge "origin/${{ github.ref_name }}" --no-ff -m "Auto-merge ${{ github.ref_name }}"; then
            echo "Clean merge."
          else
            # Two Claude branches both bump the version, which collides in
            # package.json + js/build-version.js, and both rebuild dist/, which
            # collides in whichever bundles they touched. Auto-resolve those
            # (keep the higher version, rebuild dist/ from the merged source);
            # any other conflict is a real one and must stop for a human.
            #
            # The dist rule matches every dist/*.min.js rather than a hand-kept
            # list — the list had drifted and omitted dist/supabase.min.js,
            # which failed the merge outright whenever two branches both
            # touched js/supabase.js.
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicted files:"; echo "$conflicts"
            other="$(echo "$conflicts" | grep -vE '^(package\.json|js/build-version\.js|dist/.*\.min\.js)$' || true)"
            if [ -n "$other" ]; then
              echo "::error::Conflict in non-version files — manual merge required:"
              echo "$other"
              git merge --abort
              exit 1
            fi

            # Read from HEAD (main, pre-merge) and the incoming branch tip directly
            # rather than the conflict stages — package.json/build-version.js may
            # not actually be among the conflicted files (e.g. only a dist bundle
            # conflicted), in which case stage 2/3 blobs don't exist and `git show
            # :2:/:3:` silently produce nothing, corrupting the version.
            ours="$(git show HEAD:package.json | sed -nE 's/.*"version": *"([^"]+)".*/\1/p' | head -1)"
            theirs="$(git show "origin/${{ github.ref_name }}:package.json" | sed -nE 's/.*"version": *"([^"]+)".*/\1/p' | head -1)"
            high="$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -1)"
            if [ -z "$high" ]; then
              echo "::error::Could not determine version from either side — aborting merge."
              git merge --abort
              exit 1
            fi
            echo "Resolving version conflict: ours=$ours theirs=$theirs -> $high"

            # Take the incoming branch's package.json, then force the version field
            # to the higher value; regenerate build-version.js to match.
            git checkout --theirs package.json
            sed -i -E "s/(\"version\": *\")[^\"]+/\1${high}/" package.json
            printf 'window.__BUILD_VERSION__ = "v%s";\n' "$high" > js/build-version.js

            # ⚠️ Do NOT just `git checkout --theirs` a conflicting dist bundle.
            # The old rule assumed "theirs" (the incoming branch) was always
            # built on top of main's current JS, which is false the moment a
            # second claude/** branch merges before this one's dist was
            # rebuilt against the first branch's changes — the incoming
            # branch's own bundle can be stale relative to the tree this
            # merge is about to produce, and a straight --theirs silently
            # ships an old bundle even though every source file is correct.
            # This shipped half-live at least three times in one evening
            # before being caught here. Instead: stage either side's copy
            # just to clear the conflict marker, then unconditionally
            # rebuild dist/ from the just-merged source below, which can
            # never be stale because it is generated from this exact tree.
            for f in $(echo "$conflicts" | grep -E '^dist/.*\.min\.js$' || true); do
              git checkout --theirs "$f"
              git add "$f"
            done

            git add package.json js/build-version.js
            git commit --no-edit

            # Rebuild dist/ whenever THIS merge needed any conflict
            # resolution at all — even if the only conflict was in
            # package.json/build-version.js and every dist/*.min.js merged
            # with no textual conflict. A textually clean 3-way merge of a
            # dist bundle only means neither side touched the same bytes; it
            # says nothing about whether that bundle matches the version
            # number just written above, or the js/ this merge just produced.
            # Rebuilding here is the only path that cannot ship a stale or
            # mismatched bundle. (A fully clean `git merge` with no conflicts
            # at all skips this whole branch, per the `verify` job's own
            # guarantee for that case.)
            npm run build
            if ! git diff --quiet -- dist; then
              git add dist
              git commit -m "Rebuild dist/ after auto-merge conflict resolution"
            fi
          fi

          git push origin main

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
