<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>IFrame Communicator</title>

<!--
  Required by Authorize.net's Accept Hosted payment page when embedded in an
  iframe (see js/portal/portal-billing.js). This page is loaded BY Authorize.net,
  inside an inner iframe of their own hosted form, and relays the payment
  result back to our top-level page via window.parent.parent.CommunicationHandler.
  It must be hosted on our own domain over HTTPS — that's what lets the
  message cross from Authorize.net's origin back to ours.

  This is Authorize.net's own required boilerplate (verbatim from their
  accept-sample-app reference), not app logic — do not "clean it up".
  https://github.com/AuthorizeNet/accept-sample-app/blob/master/IFrameCommunicator.html
-->

<script type="text/javascript">

function callParentFunction(str) {
  if (str && str.length > 0 && window.parent && window.parent.parent
    && window.parent.parent.CommunicationHandler && window.parent.parent.CommunicationHandler.onReceiveCommunication)
  {
     var referrer = document.referrer;
     window.parent.parent.CommunicationHandler.onReceiveCommunication({qstr : str , parent : referrer});
  }
}

function receiveMessage(event) {
  if (event && event.data) {
    callParentFunction(event.data);
  }
}

if (window.addEventListener) {
  window.addEventListener("message", receiveMessage, false);
} else if (window.attachEvent) {
  window.attachEvent("onmessage", receiveMessage);
}

if (window.location.hash && window.location.hash.length > 1) {
  callParentFunction(window.location.hash.substring(1));
}

</script>
</head>
<body>
</body>
</html>
