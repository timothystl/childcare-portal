            --sun:        #F5B731;

// ── Geofence helpers ──────────────────────────────────────────
async function _loadGeofenceSettings() {
    try {
        const { data } = await sb.from('settings').select('value').eq('key', 'geofence').maybeSingle();
        geofenceSettings = data?.value || {};
    } catch { geofenceSettings = {}; }
}

function _haversineDistanceFt(lat1, lon1, lat2, lon2) {
    const R = 20902231; // Earth radius in feet
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
}

async function _getGeoAndCheck() {
    const s = geofenceSettings || {};
    if (!s.enabled || !s.lat || !s.lng || !navigator.geolocation) {
        return { lat: null, lon: null, distanceFt: null, outsideFence: false };
    }
    return new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                const distanceFt = _haversineDistanceFt(lat, lon, Number(s.lat), Number(s.lng));
                resolve({ lat, lon, distanceFt: Math.round(distanceFt), outsideFence: distanceFt > (s.radius_ft || 300) });
            },
            () => resolve({ lat: null, lon: null, distanceFt: null, outsideFence: false }),
            { timeout: 10000, enableHighAccuracy: true }
        );
    });
}

function _notifyGeofence(eventType, distanceFt) {
    const s = geofenceSettings || {};
    if (!s.notify_email) return;
    const SUPABASE_DIRECT = 'https://dahdstopsumxnqvdclmy.supabase.co';

        method: 'POST',
        // Authorization (anon JWT) is required by the Edge Functions gateway

        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },

// ── Staff push notifications ───────────────────────────────────
const VAPID_PUBLIC_KEY = 'BBIxNz5wAh3wt5Rb3OXdirHU8_25JKle9pTDtWRHmFNkv5gLuTOX5lckdNdV0pNPaXx-qj6N9lFwrdW8auBnAhk';

function _urlBase64ToUint8Array(b64url) {
    const pad = '='.repeat((4 - b64url.length % 4) % 4);
    const b64 = (b64url + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function _maybeShowPushPrompt(id) {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if (Notification.permission === 'denied') return;
    if (localStorage.getItem('push_subscribed_' + id)) return;

// ── Helpers ───────────────────────────────────────────────────
function todayStr() {
    return new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
}

function fmtTime(iso) {
    if (!iso) return null;
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtHours(clockIn, clockOut) {
    if (!clockIn || !clockOut) return '';
    const hrs = (new Date(clockOut) - new Date(clockIn)) / 3600000;
    return `${hrs.toFixed(2)} hrs worked`;
}

// ── PIN UI ─────────────────────────────────────────────────────

// ── PIN Rate Limiting ─────────────────────────────────────────
const MAX_ATTEMPTS    = 5;
const LOCKOUT_MS      = 5 * 60 * 1000; // 5 minutes
const STORAGE_KEY     = 'pin_lockout';

function getLockoutState() {
    try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { attempts: 0, lockedUntil: 0 };
    } catch { return { attempts: 0, lockedUntil: 0 }; }
}

function saveLockoutState(state) {
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

function recordFailedAttempt() {
    const state = getLockoutState();
    state.attempts += 1;
    if (state.attempts >= MAX_ATTEMPTS) {
        state.lockedUntil = Date.now() + LOCKOUT_MS;
        state.attempts    = 0;
    }
    saveLockoutState(state);
}

function checkLockout() {
    const state = getLockoutState();
    if (state.lockedUntil && Date.now() < state.lockedUntil) {
        const secsLeft = Math.ceil((state.lockedUntil - Date.now()) / 1000);
        const mins     = Math.floor(secsLeft / 60);
        const secs     = secsLeft % 60;
        showError(`Too many failed attempts. Try again in ${mins}:${String(secs).padStart(2,'0')}.`);
        return true;
    }
    return false;
}

// ── Verify PIN ────────────────────────────────────────────────
async function verifyPin() {
    showScreen('loading');
    try {
        const { data, error } = await sb.rpc('lookup_staff_by_pin', { p_pin: parseInt(pin, 10) });
        if (error) throw error;
        if (!data) {
            recordFailedAttempt();
            showScreen('pin');
            showError('Invalid PIN. Please try again.');
            return;
        }

        staffId     = data.id;
        staffRoomId = data.room_id || null;
        _staffName  = data.name;
        document.getElementById('staffName').textContent = data.name;
        document.getElementById('staffRole').textContent = data.role || '';
        workDate = todayStr();
        document.getElementById('dateLabel').textContent =
            new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

        await refreshClockStatus();
        _maybeShowPushPrompt(staffId);
        // Route: clock-out goes straight to clock screen; clock-in needs room selection first
        if (openEventId) {
            showScreen('clock');
        } else {
            buildRoomScreen();
            showScreen('room');
        }
    } catch (err) {
        showScreen('pin');
        const msg = err?.message || String(err);
        showError('Error: ' + msg);
    }
}

// ── Clock Status ──────────────────────────────────────────────
let openEventId = null; // ID of the current open clock-in event

async function refreshClockStatus() {
    // Fetch ALL events for this staff+day (supports multiple shifts)
    const { data: events, error } = await sb
        .from('staff_clock_events')
        .select('id, clock_in, clock_out')
        .eq('staff_id', staffId)
        .eq('work_date', workDate)
        .order('clock_in', { ascending: true });
    if (error) throw error;

    const all = events || [];

    // Find the most recent open event (clocked in, not yet out)
    const openEvent = [...all].reverse().find(e => e.clock_in && !e.clock_out) || null;
    openEventId = openEvent?.id || null;

    // Sum total milliseconds across all completed events
    let totalMs = 0;
    all.forEach(e => {
        if (e.clock_in && e.clock_out)
            totalMs += new Date(e.clock_out) - new Date(e.clock_in);
    });
    // If currently clocked in, include time since last clock-in
    if (openEvent) totalMs += Date.now() - new Date(openEvent.clock_in);

    const lastEvent = all[all.length - 1] || null;
    const displayIn  = openEvent?.clock_in || lastEvent?.clock_in || null;
    const displayOut = openEvent ? null : (lastEvent?.clock_out || null);
    const totalHrs   = totalMs > 0 ? (totalMs / 3600000).toFixed(2) + ' hrs total' : '';

    document.getElementById('clockInTime').textContent  = fmtTime(displayIn)  || '—';
    document.getElementById('clockInTime').className    = displayIn  ? '' : 'status-none';
    document.getElementById('clockOutTime').textContent = fmtTime(displayOut) || '—';
    document.getElementById('clockOutTime').className   = displayOut ? '' : 'status-none';
    document.getElementById('hoursTotal').textContent   = totalHrs;

    // Buttons: show Clock Out if an open shift exists; Clock In otherwise (can start a new shift anytime)
    const btnIn  = document.getElementById('btnClockIn');
    const btnOut = document.getElementById('btnClockOut');
    if (openEvent) {
        btnIn.style.display  = 'none';
        btnOut.style.display = '';
    } else {
        btnIn.style.display  = '';
        btnOut.style.display = 'none';
        if (all.length > 0)
            setMsg('Shift recorded. Clock in again to start a new shift.', 'ok');
    }
}

// ── Room Selection ────────────────────────────────────────────
function buildRoomScreen() {
    document.getElementById('roomStaffName').textContent =
        document.getElementById('staffName').textContent;
    selectedRoomId = staffRoomId; // pre-select assigned room; null for floats
    document.getElementById('roomMsg').textContent = '';

    const grid = document.getElementById('roomGrid');
    grid.innerHTML = CLOCK_ROOMS.map(r =>
        `<button class="room-btn${selectedRoomId === r.id ? ' selected' : ''}" data-room="${r.id}">${r.label}</button>`
    ).join('');
    grid.querySelectorAll('.room-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedRoomId = btn.dataset.room;
            grid.querySelectorAll('.room-btn').forEach(b =>
                b.classList.toggle('selected', b.dataset.room === selectedRoomId));
            document.getElementById('btnConfirmClockIn').disabled = false;
        });
    });

    const confirmBtn = document.getElementById('btnConfirmClockIn');
    confirmBtn.disabled = !selectedRoomId;
    confirmBtn.textContent = 'Clock In';
}

document.getElementById('btnConfirmClockIn').addEventListener('click', async () => {
    if (!selectedRoomId) return;
    const btn = document.getElementById('btnConfirmClockIn');
    btn.disabled = true; btn.textContent = 'Clocking in…';
    try {
        const geo = await _getGeoAndCheck();
        const now = new Date().toISOString();
        const row = { staff_id: staffId, work_date: workDate, clock_in: now, clock_out: null, room_id: selectedRoomId,
                      clock_in_outside_fence: geo.outsideFence };
        if (geo.lat != null) { row.clock_in_lat = geo.lat; row.clock_in_lon = geo.lon; }
        const { error } = await sb.from('staff_clock_events').insert(row);
        if (error) throw error;
        if (geo.outsideFence) {
            _notifyGeofence('clock_in', geo.distanceFt);
            document.getElementById('roomMsg').textContent =
                `⚠️ Clocked in — but you appear to be ${geo.distanceFt} ft from school. The director has been notified.`;
            document.getElementById('roomMsg').className = 'msg msg-warn';
        } else {
            document.getElementById('roomMsg').textContent = 'Clocked in! Have a great day!';
            document.getElementById('roomMsg').className = 'msg msg-ok';
        }
        await refreshClockStatus();
        setTimeout(() => {
            staffId = null; staffRoomId = null; selectedRoomId = null; pin = '';
            updateDots();
            document.getElementById('pinError').textContent = '';
            document.getElementById('roomMsg').textContent = '';
            showScreen('pin');
        }, 2500);
    } catch (err) {
        document.getElementById('roomMsg').textContent = 'Error: ' + err.message;
        document.getElementById('roomMsg').className = 'msg msg-err';
        btn.disabled = false; btn.textContent = 'Clock In';
    }
});

document.getElementById('btnRoomCancel').addEventListener('click', () => {
    staffId = null; staffRoomId = null; selectedRoomId = null; pin = '';
    updateDots();
    document.getElementById('pinError').textContent = '';
    showScreen('pin');
});

// ── Clock In (second shift from clock screen) ─────────────────
document.getElementById('btnClockIn').addEventListener('click', () => {
    setMsg('', '');
    buildRoomScreen();
    showScreen('room');
});

// ── Clock Out ─────────────────────────────────────────────────
document.getElementById('btnClockOut').addEventListener('click', async () => {
    setMsg('', '');
    const btn = document.getElementById('btnClockOut');
    btn.disabled = true; btn.textContent = 'Clocking out…';
    try {
        if (!openEventId) throw new Error('No open clock-in found. Please try again.');
        const geo = await _getGeoAndCheck();
        const now = new Date().toISOString();
        const upd = { clock_out: now, clock_out_outside_fence: geo.outsideFence };
        if (geo.lat != null) { upd.clock_out_lat = geo.lat; upd.clock_out_lon = geo.lon; }
        // Update only the specific open event by ID — not all rows for this staff+day
        const { error } = await sb.from('staff_clock_events')
            .update(upd)
            .eq('id', openEventId);
        if (error) throw error;
        if (geo.outsideFence) {
            _notifyGeofence('clock_out', geo.distanceFt);
            setMsg(`⚠️ Clocked out — but you appear to be ${geo.distanceFt} ft from school. The director has been notified.`, 'warn');
        } else {
            setMsg('Clocked out. Have a great rest of your day!', 'ok');
        }
        await refreshClockStatus();
    } catch (err) {
        setMsg('Error: ' + err.message, 'err');
    } finally { btn.disabled = false; btn.textContent = 'Clock Out'; }
});

// ── Sign Out ──────────────────────────────────────────────────
document.getElementById('btnSignOut').addEventListener('click', () => {
    staffId = null; staffRoomId = null; selectedRoomId = null; pin = '';
    updateDots();
    document.getElementById('pinError').textContent = '';
    document.getElementById('clockMsg').textContent = '';
    showScreen('pin');
});

function setMsg(text, type) {
    const el = document.getElementById('clockMsg');
    el.textContent = text;
    el.className   = 'msg' + (type ? ' msg-' + type : '');
}
