<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/logo/favicon-16.png">
  <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#01294A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Staff Log — Timothy Lutheran Church MDO</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/staff.css">
</head>
<body class="sl-body">

    <!-- PIN -->
    <div id="slPinScreen" class="sl-screen sl-center">
        <div class="sl-card">
            <div class="sl-logo"><img src="/images/logo/myMDO_primary_logo_light.png" alt="myMDO"></div>
            <h1>Staff Log</h1>
            <p class="sl-sub">Enter your kiosk PIN.</p>
            <input type="password" id="slPinInput" class="sl-pin-input" placeholder="••••"
                   inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
            <button id="slPinBtn" class="btn-primary sl-btn">Sign In</button>
            <p class="sl-hint">Your PIN is not stored on this phone. You'll re-enter it if the page reloads.</p>
        </div>
    </div>

    <!-- Room picker -->
    <div id="slRoomScreen" class="sl-screen hidden">
        <header class="sl-header">
            <span id="slWhoami" class="sl-whoami"></span>
            <button id="slSignOutBtn" class="sl-link-btn">Sign out</button>
        </header>
        <h2 class="sl-h2">Which room?</h2>
        <div id="slRoomList" class="sl-room-list"></div>
    </div>

    <!-- Roster -->
    <div id="slRosterScreen" class="sl-screen hidden">
        <header class="sl-header">
            <button id="slChangeRoomBtn" class="sl-link-btn">← Rooms</button>
            <span id="slRoomTitle" class="sl-room-title"></span>
            <button id="slRefreshBtn" class="sl-link-btn">Refresh</button>
        </header>
        <div id="slRoster" class="sl-roster"></div>
        <button id="slPostBtn" class="sl-post-btn hidden">Post 0</button>
    </div>

    <!-- Quick-log sheet -->
    <div id="slSheet" class="sl-sheet hidden">
        <div class="sl-sheet-inner">
            <div class="sl-sheet-head">
                <span id="slSheetName" class="sl-sheet-name"></span>
                <button id="slSheetClose" class="sl-link-btn">Done</button>
            </div>
            <!-- Safety first, literally: this renders above every input so a
                 member of staff reaching for the bottle chip cannot miss that
                 this child can't have dairy. -->
            <div id="slSheetSafety" class="sl-safety"></div>
            <div id="slSheetActions" class="sl-actions"></div>
        </div>
    </div>

    <div id="slToast" class="sl-toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
    <script src="dist/supabase.min.js"></script>
    <script src="dist/error-monitor.min.js"></script>
    <script src="dist/staff.min.js"></script>
</body>
</html>
